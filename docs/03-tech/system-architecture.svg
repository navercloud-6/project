<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" width="1120" height="630" role="img" aria-labelledby="title desc">
  <title id="title">경기 하루이음 시스템 아키텍처</title>
  <desc id="desc">사용자가 브라우저에서 NCP VPC의 리버스 프록시와 Next.js 16 앱으로 접속하고, 사설망의 Cloud DB for PostgreSQL과 외부 NAVER Cloud AI 및 Open-Meteo 기상 API와 연동되는 시스템 아키텍처</desc>

  <defs>

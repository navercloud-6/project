      .font { font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', -apple-system, sans-serif; }
      .title { font-size: 21px; font-weight: 800; fill: #0f172a; letter-spacing: -0.3px; }
      .subtitle { font-size: 12px; font-weight: 500; fill: #64748b; }
      .zone-title { font-size: 13.5px; font-weight: 800; fill: #0f172a; }
      .card-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .card-sub { font-size: 10.5px; font-weight: 400; fill: #475569; }
      .strip-key { font-size: 11px; font-weight: 700; }
      .strip-val { font-size: 10.5px; font-weight: 400; fill: #334155; }
      .chip-title { font-size: 11px; font-weight: 700; fill: #0f172a; }
      .chip-sub { font-size: 9.5px; font-weight: 400; fill: #475569; }
      .badge { font-size: 10px; font-weight: 700; }
      .edge-label { font-size: 10.5px; font-weight: 700; }
      .edge-sub { font-size: 9.5px; font-weight: 500; fill: #64748b; }
    </style>

    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>

    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#059669" />
    </marker>
    <marker id="arr-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" fill="#0284c7" />
    </marker>

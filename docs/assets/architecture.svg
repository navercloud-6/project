    <text x="24" y="126" class="heading">Next.js 서버</text>
    <text x="24" y="154" class="subtitle">App Router · Route Handler API</text>
    <text x="24" y="181" class="subtitle">헥사고날 · Docker 컨테이너</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
    <text x="24" y="233" class="role">HTTP 어댑터 · OpenAPI</text>
    <text x="24" y="264" class="body">세션·Origin 검사 · 요청 한도</text>
    <text x="24" y="315" class="role">Application · Domain</text>
    <text x="24" y="346" class="body">검색·추천 · 통합 안내 · 여행 편집</text>

    <rect width="400" height="404" rx="14" fill="#FFFFFF" stroke="#DBDEE3"/>
    <rect x="24" y="24" width="64" height="64" rx="16" fill="#E7EDF9"/>
    <g class="icon" transform="translate(32 32)" aria-hidden="true"><rect x="2" y="7" width="29" height="24" rx="4"/><path d="M2 14h29M11 39h11M16.5 31v8"/><rect x="35" y="18" width="11" height="21" rx="3"/><path d="M39.5 35h2"/></g>
    <text x="104" y="63" class="label">01 | 사용자 화면</text>
    <text x="24" y="126" class="heading">웹 브라우저</text>
    <text x="24" y="154" class="subtitle">여행자 · 데스크톱 · 모바일</text>
    <text x="24" y="181" class="subtitle">React 19 · NAVER Maps v3</text>
    <path d="M24 200H376" stroke="#DBDEE3"/>
    <text x="24" y="233" class="role">5개 탭 화면</text>
    <text x="24" y="264" class="body">둘러보기 · 날씨 · 도우미 · 내 여행</text>
    <text x="24" y="315" class="role">세션 · 보안 경계</text>
    <text x="24" y="346" class="body">HttpOnly 쿠키 · /api/* 만 호출</text>
  </g>
